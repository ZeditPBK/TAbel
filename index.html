<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Табель практических занятий | Группа 2576-ЭБ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Основной скроллбар страницы и таблиц */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Увеличенный удобный ползунок специально для фильтра студентов на ПК */
    .cal-scrollbar::-webkit-scrollbar { height: 10px; }
    .cal-scrollbar::-webkit-scrollbar-track { background: #090d16; border-radius: 8px; border: 1px solid #1e293b; }
    .cal-scrollbar::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 8px; cursor: pointer; }
    .cal-scrollbar::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    .cal-scrollbar { scrollbar-width: auto; scrollbar-color: #4f46e5 #090d16; }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Реальная сетка календаря на 2026/2027 учебный год
    // offset: сдвиг первого числа относительно Понедельника (0 = Пн, 1 = Вт, 2 = Ср, 3 = Чт, 4 = Пт, 5 = Сб, 6 = Вс)
    const MONTHS = [
      { id: "Сентябрь", num: "09", days: 30, offset: 1, year: 2026 }, // 1 сен 2026 — Вторник
      { id: "Октябрь", num: "10", days: 31, offset: 3, year: 2026 },  // 1 окт 2026 — Четверг
      { id: "Ноябрь", num: "11", days: 30, offset: 6, year: 2026 },   // 1 ноя 2026 — Воскресенье
      { id: "Декабрь", num: "12", days: 31, offset: 1, year: 2026 },  // 1 дек 2026 — Вторник
      { id: "Январь", num: "01", days: 31, offset: 4, year: 2027 },   // 1 янв 2027 — Пятница
      { id: "Февраль", num: "02", days: 28, offset: 0, year: 2027 },  // 1 фев 2027 — Понедельник
      { id: "Март", num: "03", days: 31, offset: 0, year: 2027 },     // 1 мар 2027 — Понедельник
      { id: "Апрель", num: "04", days: 30, offset: 3, year: 2027 },   // 1 апр 2027 — Четверг
      { id: "Май", num: "05", days: 31, offset: 5, year: 2027 },      // 1 мая 2027 — Суббота
      { id: "Июнь", num: "06", days: 30, offset: 1, year: 2027 },     // 1 июн 2027 — Вторник
      { id: "Июль", num: "07", days: 31, offset: 3, year: 2027 },     // 1 июл 2027 — Четверг
      { id: "Август", num: "08", days: 31, offset: 6, year: 2027 }    // 1 авг 2027 — Воскресенье
    ];

    const WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

    const SUBJECTS = [
      { id: "opd", name: "Основы предпринимательской деятельности", short: "ОПД" },
      { id: "soc", name: "Социология", short: "Социология" },
      { id: "tv", name: "Теория вероятностей и мат. стат.", short: "Теор. вер." },
      { id: "ei", name: "Экономическая информатика", short: "Эк. инф." },
      { id: "pr", name: "Правовое регулирование", short: "Прав. рег." },
      { id: "fiz", name: "Физическая культура", short: "Физ-ра" },
      { id: "macro", name: "Макроэкономика", short: "Макроэк." },
      { id: "rit", name: "Риторика", short: "Риторика" },
      { id: "psy", name: "Психология и этика деловых отношений", short: "Психология" },
      { id: "ipd", name: "История профсоюзного движения", short: "ИПД" },
    ];

    const STUDENTS = [
      "Басалай", "Бондарев", "Варлахов", "Волков", 
      "Дмитриева", "Зенченко", "Ковалев", "Коваль", 
      "Лавринович", "Мартинович", "Молчанов", "Никитенко", 
      "Сивец", "Соболь", "Троцкая", "Чупринская"
    ];

    // q == false -> Неуважительная причина (платная отработка)
    // q == true  -> Уважительная причина (справка / заявление)
    const INITIAL_OCTOBER = {
      "Бондарев": { soc: [{ date: "16.10", count: 1, q: false }] },
      "Варлахов": { 
        fiz: [{ date: "13.10", count: 2, q: false }], 
        soc: [{ date: "16.10", count: 1, q: false }], 
        tv: [{ date: "28.10", count: 1, q: false }, { date: "29.10", count: 1, q: false }] 
      },
      "Волков": { opd: [{ date: "26.10", count: 1, q: false }, { date: "30.10", count: 1, q: false }] },
      "Дмитриева": { 
        opd: [{ date: "16.10", count: 1, q: false }], 
        soc: [{ date: "16.10", count: 1, q: false }] 
      },
      "Коваль": { 
        pr: [{ date: "12.10", count: 1, q: false }], 
        soc: [{ date: "16.10", count: 1, q: false }] 
      },
      "Лавринович": { 
        tv: [{ date: "01.10", count: 1, q: false }], 
        opd: [{ date: "26.10", count: 1, q: false }, { date: "30.10", count: 1, q: false }] 
      },
      "Молчанов": { opd: [{ date: "16.10", count: 1, q: false }] },
      "Никитенко": { 
        tv: [{ date: "01.10", count: 1, q: false }, { date: "28.10", count: 1, q: true }], 
        opd: [{ date: "02.10", count: 1, q: false }, { date: "26.10", count: 1, q: false }], 
        soc: [{ date: "02.10", count: 1, q: false }, { date: "16.10", count: 1, q: false }], 
        pr: [{ date: "12.10", count: 1, q: false }],
        ei: [{ date: "28.10", count: 1, q: true }]
      },
      "Сивец": { opd: [{ date: "26.10", count: 1, q: false }] },
      "Соболь": { soc: [{ date: "16.10", count: 1, q: false }] },
      "Троцкая": { 
        soc: [{ date: "16.10", count: 1, q: false }], 
        opd: [{ date: "30.10", count: 1, q: false }],
        tv: [{ date: "28.10", count: 1, q: true }],
        ei: [{ date: "28.10", count: 1, q: true }]
      },
      "Чупринская": { 
        ei: [{ date: "15.10", count: 1, q: false }], 
        tv: [{ date: "15.10", count: 1, q: false }] 
      }
    };

    // Ключи JSONBin.io
    const JSONBIN_BIN_ID = "6aec6e96ac6210605a6ef023";
    const JSONBIN_API_KEY = "$2a$10$igyI7EDvVBuwbkHqRGzdle5Bu/OQ8P8G6Iw48ti25iCbtrywyj/G2";
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

    function App() {
      const [currentMonth, setCurrentMonth] = useState("Октябрь");
      // minimal (главный мобильный вид) | sheet1 (даты) | sheet3 (числа) | admin (уголок администратора)
      const [viewMode, setViewMode] = useState("minimal");
      const [searchQuery, setSearchQuery] = useState("");
      const [onlyDebtors, setOnlyDebtors] = useState(false);

      // Метаданные, синхронизируемые с облаком
      const [pricePerClass, setPricePerClass] = useState(() => localStorage.getItem("tabel_price_2576") || "");
      const [lastEdited, setLastEdited] = useState(() => localStorage.getItem("tabel_last_edited_2576") || "Недавно");
      const [adminPin, setAdminPin] = useState(() => localStorage.getItem("tabel_admin_pin_2576") || "2576");

      // Статус привязки устройства администратора
      const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem("tabel_device_bound_admin") === "true");
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [pinInput, setPinInput] = useState("");
      const [newPinSetting, setNewPinSetting] = useState("");

      const [allData, setAllData] = useState(() => {
        const saved = localStorage.getItem("tabel_dark_data_2576");
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return { "Октябрь": INITIAL_OCTOBER };
      });

      const [syncStatus, setSyncStatus] = useState("Синхронизация...");
      const [isSaving, setIsSaving] = useState(false);
      const [showHeader, setShowHeader] = useState(true);
      const lastScrollY = useRef(0);

      // Модальные окна и шторки
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [activeCell, setActiveCell] = useState(null);
      const [newDateInput, setNewDateInput] = useState("");
      const [newCountInput, setNewCountInput] = useState(1);
      const [newIsExcused, setNewIsExcused] = useState(false);

      // Массовое добавление пары («➕ Внести пару»)
      const [batchModalOpen, setBatchModalOpen] = useState(false);
      const [batchSubject, setBatchSubject] = useState(SUBJECTS[0].id);
      const [batchDate, setBatchDate] = useState("");
      const [batchCount, setBatchCount] = useState(1);
      const [batchIsExcused, setBatchIsExcused] = useState(false);
      const [batchSelectedStudents, setBatchSelectedStudents] = useState([]);

      // Состояния Гибридного Календаря в Уголке Администратора
      const [calStudent, setCalStudent] = useState("ALL"); // "ALL" или конкретная фамилия
      const [calSelectedDates, setCalSelectedDates] = useState([]); // Массив дат вида ["02.10", "16.10"]
      const [lastClickedDayNum, setLastClickedDayNum] = useState(null); // Для выделения диапазона через Shift + Клик

      // Модальное окно сводки для чата
      const [summaryModalOpen, setSummaryModalOpen] = useState(false);

      // Сброс выбранных дат календаря при смене месяца
      useEffect(() => {
        setCalSelectedDates([]);
        setLastClickedDayNum(null);
      }, [currentMonth]);

      // Проверка ссылки-приглашения для помощника администратора (?admin=...)
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const inviteKey = params.get("admin");
        if (inviteKey) {
          localStorage.setItem("tabel_device_bound_admin", "true");
          setIsAdmin(true);
          window.history.replaceState({}, document.title, window.location.pathname);
          alert("Устройство успешно привязано! Вам открыт «Уголок администратора».");
        }
      }, []);

      // Умное скрытие верхней панели при скролле вниз на смартфоне
      useEffect(() => {
        const handleScroll = () => {
          const currentY = window.scrollY;
          if (currentY <= 40) {
            setShowHeader(true);
          } else if (currentY > lastScrollY.current + 7) {
            setShowHeader(false);
          } else if (currentY < lastScrollY.current - 7) {
            setShowHeader(true);
          }
          lastScrollY.current = currentY;
        };
        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      // Загрузка из облака при старте
      useEffect(() => {
        loadFromCloud();
      }, []);

      const monthObj = useMemo(() => MONTHS.find(m => m.id === currentMonth) || MONTHS[1], [currentMonth]);
      const monthData = useMemo(() => allData[currentMonth] || {}, [allData, currentMonth]);

      // Активен ли тариф BYN (больше 0)
      const activeTariff = useMemo(() => {
        const val = parseFloat(pricePerClass);
        return (!isNaN(val) && val > 0) ? val : 0;
      }, [pricePerClass]);

      const getFormattedNow = () => {
        const now = new Date();
        const d = String(now.getDate()).padStart(2, "0");
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const time = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        return `${d}.${m} в ${time}`;
      };

      const loadFromCloud = async () => {
        setSyncStatus("Обновление...");
        try {
          const res = await fetch(`${JSONBIN_URL}/latest`, {
            headers: { "X-Master-Key": JSONBIN_API_KEY }
          });
          if (res.ok) {
            const result = await res.json();
            const record = result.record;
            if (record && typeof record === "object" && record["Октябрь"]) {
              const { _meta, ...monthsPayload } = record;
              setAllData(monthsPayload);
              localStorage.setItem("tabel_dark_data_2576", JSON.stringify(monthsPayload));

              if (_meta) {
                if (_meta.lastEdited) {
                  setLastEdited(_meta.lastEdited);
                  localStorage.setItem("tabel_last_edited_2576", _meta.lastEdited);
                }
                if (_meta.pricePerClass !== undefined) {
                  setPricePerClass(_meta.pricePerClass);
                  localStorage.setItem("tabel_price_2576", _meta.pricePerClass);
                }
                if (_meta.adminPin) {
                  setAdminPin(_meta.adminPin);
                  localStorage.setItem("tabel_admin_pin_2576", _meta.adminPin);
                }
              }
              setSyncStatus("Синхронизировано");
              return;
            } else {
              await saveToCloud(allData, pricePerClass, adminPin);
              return;
            }
          }
          setSyncStatus("Автономный режим");
        } catch (err) {
          setSyncStatus("Локальная копия");
        }
      };

      const saveToCloud = async (updatedData, customPrice = pricePerClass, customPin = adminPin) => {
        setIsSaving(true);
        setSyncStatus("Сохранение...");
        const editedStamp = getFormattedNow();
        setLastEdited(editedStamp);

        localStorage.setItem("tabel_dark_data_2576", JSON.stringify(updatedData));
        localStorage.setItem("tabel_last_edited_2576", editedStamp);
        localStorage.setItem("tabel_price_2576", customPrice);
        localStorage.setItem("tabel_admin_pin_2576", customPin);

        const payload = {
          ...updatedData,
          _meta: {
            lastEdited: editedStamp,
            pricePerClass: customPrice,
            adminPin: customPin
          }
        };

        try {
          const res = await fetch(JSONBIN_URL, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": JSONBIN_API_KEY
            },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            setSyncStatus("Сохранено");
          } else {
            setSyncStatus("Сохранено локально");
          }
        } catch (err) {
          setSyncStatus("Сохранено локально");
        } finally {
          setIsSaving(false);
        }
      };

      // Получение записей по студенту и предмету
      const getEntries = (student, subjId) => {
        return monthData[student]?.[subjId] || [];
      };

      // Статистика по студенту:
      // unexcused (неуважительные занятия), unexcusedHours (неуважительные часы = x2), excused (уважительные занятия)
      const getStudentSummary = (student) => {
        let unexcused = 0;
        let excused = 0;
        const allDatesBySubj = [];

        SUBJECTS.forEach(s => {
          const entries = getEntries(student, s.id);
          if (entries.length > 0) {
            const dList = [];
            entries.forEach(e => {
              if (e.q) excused += e.count;
              else unexcused += e.count;
              dList.push({
                text: `${e.date}${e.count > 1 ? ` (x${e.count})` : ""}`,
                excused: Boolean(e.q),
                count: e.count,
                date: e.date
              });
            });
            allDatesBySubj.push({ id: s.id, short: s.short, name: s.name, items: dList });
          }
        });

        const unexcusedHours = unexcused * 2;
        return { unexcused, unexcusedHours, excused, total: unexcused + excused, allDatesBySubj };
      };

      // Общая статистика за месяц (без суммарного счетчика неуважительных часов)
      const monthTotals = useMemo(() => {
        let totalUnexcused = 0;
        let totalExcused = 0;
        let studentsWithAbsences = 0;
        let studentsWithPaid = 0;
        const bySubject = {};
        SUBJECTS.forEach(s => { bySubject[s.id] = { unexcused: 0, excused: 0 }; });

        STUDENTS.forEach(st => {
          const { unexcused, excused } = getStudentSummary(st);
          totalUnexcused += unexcused;
          totalExcused += excused;
          if (unexcused > 0 || excused > 0) studentsWithAbsences++;
          if (unexcused > 0) studentsWithPaid++;

          SUBJECTS.forEach(s => {
            const entries = getEntries(st, s.id);
            entries.forEach(e => {
              if (e.q) bySubject[s.id].excused += e.count;
              else bySubject[s.id].unexcused += e.count;
            });
          });
        });

        return { totalUnexcused, totalExcused, studentsWithAbsences, studentsWithPaid, bySubject };
      }, [monthData]);

      // =========================================================================
      // ЛОГИКА ГИБРИДНОГО КАЛЕНДАРЯ В УГОЛКЕ АДМИНИСТРАТОРА
      // =========================================================================
      const calendarDaysData = useMemo(() => {
        const days = [];
        const targetStudents = calStudent === "ALL" ? STUDENTS : [calStudent];

        for (let d = 1; d <= monthObj.days; d++) {
          const dateStr = `${String(d).padStart(2, "0")}.${monthObj.num}`;
          let unexcusedCount = 0;
          let excusedCount = 0;

          targetStudents.forEach(st => {
            SUBJECTS.forEach(subj => {
              const entries = monthData[st]?.[subj.id] || [];
              entries.forEach(e => {
                if (e.date === dateStr) {
                  if (e.q) excusedCount += e.count;
                  else unexcusedCount += e.count;
                }
              });
            });
          });

          // Индекс дня недели (0 = Пн ... 6 = Вс)
          const weekdayIndex = (monthObj.offset + d - 1) % 7;

          days.push({
            dayNum: d,
            dateStr,
            weekdayIndex,
            isSunday: weekdayIndex === 6,
            unexcusedCount,
            excusedCount,
            total: unexcusedCount + excusedCount
          });
        }
        return days;
      }, [monthData, monthObj, calStudent]);

      // Список записей, попавших в выбранные на календаре дни
      const calendarMatchedRecords = useMemo(() => {
        if (calSelectedDates.length === 0) return [];
        const targetStudents = calStudent === "ALL" ? STUDENTS : [calStudent];
        const results = [];

        targetStudents.forEach(st => {
          const items = [];
          let unexcusedSum = 0;
          let excusedSum = 0;

          SUBJECTS.forEach(subj => {
            const entries = monthData[st]?.[subj.id] || [];
            entries.forEach((e, idx) => {
              if (calSelectedDates.includes(e.date)) {
                items.push({
                  subjId: subj.id,
                  subjShort: subj.short,
                  date: e.date,
                  count: e.count,
                  excused: Boolean(e.q),
                  entryIdx: idx
                });
                if (e.q) excusedSum += e.count;
                else unexcusedSum += e.count;
              }
            });
          });

          if (items.length > 0) {
            results.push({
              student: st,
              items,
              unexcusedSum,
              excusedSum
            });
          }
        });

        return results;
      }, [calSelectedDates, calStudent, monthData]);

      // Клик по числу календаря (с поддержкой выделения диапазона через Shift + Клик)
      const handleCalendarDayClick = (day, event) => {
        if (event.shiftKey && lastClickedDayNum !== null) {
          const start = Math.min(lastClickedDayNum, day.dayNum);
          const end = Math.max(lastClickedDayNum, day.dayNum);
          const rangeDates = [];
          for (let i = start; i <= end; i++) {
            rangeDates.push(`${String(i).padStart(2, "0")}.${monthObj.num}`);
          }
          setCalSelectedDates(prev => {
            const combined = new Set([...prev, ...rangeDates]);
            return Array.from(combined);
          });
        } else {
          setCalSelectedDates(prev =>
            prev.includes(day.dateStr) ? prev.filter(d => d !== day.dateStr) : [...prev, day.dateStr]
          );
        }
        setLastClickedDayNum(day.dayNum);
      };

      const selectAllDaysWithAbsences = () => {
        const activeDates = calendarDaysData.filter(d => d.total > 0).map(d => d.dateStr);
        setCalSelectedDates(activeDates);
      };

      // Массовый перевод всех пар за выбранные дни для конкретного студента или всей выборки
      const applyCalendarReasonChange = (targetStudentOrAll, makeExcused) => {
        if (!isAdmin || calSelectedDates.length === 0) return;
        const studentsToUpdate = targetStudentOrAll === "ALL"
          ? calendarMatchedRecords.map(r => r.student)
          : [targetStudentOrAll];

        if (studentsToUpdate.length === 0) return;

        const monthCopy = { ...(allData[currentMonth] || {}) };

        studentsToUpdate.forEach(st => {
          const studentCopy = { ...(monthCopy[st] || {}) };
          SUBJECTS.forEach(subj => {
            const entries = studentCopy[subj.id];
            if (entries && entries.length > 0) {
              studentCopy[subj.id] = entries.map(e => {
                if (calSelectedDates.includes(e.date)) {
                  return { ...e, q: makeExcused };
                }
                return e;
              });
            }
          });
          monthCopy[st] = studentCopy;
        });

        const updated = { ...allData, [currentMonth]: monthCopy };
        setAllData(updated);
        saveToCloud(updated);
      };

      // Полная очистка всех записей выбранного месяца (Предложение 5)
      const handleClearCurrentMonth = () => {
        if (!isAdmin) return;
        const confirmed = window.confirm(
          `Вы уверены, что хотите полностью очистить все записи пропусков за ${currentMonth}? Это действие сбросит данные текущего месяца для всей группы.`
        );
        if (!confirmed) return;

        const updated = {
          ...allData,

        else if (/^\d{1,2}$/.test(formattedDate)) {

        const currentList = [...getEntries(student, subject.id)];
        currentList.push({
          date: formattedDate,
          count: Math.max(1, parseInt(newCountInput, 10) || 1),
          q: newIsExcused
        });

        const updated = {
          ...allData,
          [currentMonth]: {
            ...(allData[currentMonth] || {}),
            [student]: {
              ...(allData[currentMonth]?.[student] || {}),
              [subject.id]: currentList

        setAllData(updated);
        saveToCloud(updated);
        setNewDateInput("");

        let formattedDate = batchDate.trim();
        if (!formattedDate) {
          const today = String(new Date().getDate()).padStart(2, "0");
          formattedDate = `${today}.${monthObj.num}`;
        } else if (/^\d{1,2}$/.test(formattedDate)) {
          formattedDate = `${formattedDate.padStart(2, "0")}.${monthObj.num}`;
        }

        batchSelectedStudents.forEach(student => {
          const studentCopy = { ...(monthCopy[student] || {}) };
          const subjList = [...(studentCopy[batchSubject] || [])];
          subjList.push({
            date: formattedDate,
            count: Math.max(1, parseInt(batchCount, 10) || 1),
            q: batchIsExcused

          studentCopy[batchSubject] = subjList;
          monthCopy[student] = studentCopy;

        saveToCloud(updated);
        setBatchSelectedStudents([]);
        setBatchModalOpen(false);

          ...allData,

        setAllData(updated);
        saveToCloud(updated);

        STUDENTS.forEach((st, i) => {

          const rowCells = SUBJECTS.map(s => {
            const entries = getEntries(st, s.id);

            const totalC = entries.reduce((acc, e) => acc + e.count, 0);
            const datesStr = entries.map(e => `${e.date}${e.q ? " (уваж.)" : ""}`).join(", ");
            return `${totalC} (${datesStr})`;

          csv += `${i + 1};${st};${rowCells.join(";")};${unexcused};${unexcusedHours};${excused}${bynCol}\n`;
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Табель_2576-ЭБ_${currentMonth}.csv`;

                        <div
                          key={idx}
                          className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs"
                        >
                          <div className="flex items-center gap-2 font-mono">
                            <span className="text-white font-bold">{entry.date}</span>
                            <span className="text-slate-400">({entry.count} зан. / {entry.count * 2} ч.)</span>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <button
                              type="button"
                              onClick={() => handleToggleEntryReason(activeCell.student, activeCell.subject.id, idx)}
                              className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${
                                entry.q
                                  ? "bg-sky-500/20 border-sky-500/40 text-sky-300"
                                  : "bg-rose-500/20 border-rose-500/40 text-rose-300"
                              }`}
                            >
                              {entry.q ? "Уважительная" : "Неуважительная"}
                            </button>
                            <button
                              type="button"
                              onClick={() => handleRemoveEntry(activeCell.student, activeCell.subject.id, idx)}
                              className="px-2 py-1 rounded-lg bg-slate-800 hover:bg-rose-500/20 text-rose-400 border border-slate-700 font-bold"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <form onSubmit={handleAddAbsence} className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 space-y-3">
                  <div className="text-xs font-bold text-indigo-300">➕ Добавить пропуск</div>
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Число или дата:</label>
                      <input
                        type="text"
                        placeholder={`напр. 18 или 18.${monthObj.num}`}
                        value={newDateInput}
                        onChange={e => setNewDateInput(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-base sm:text-xs text-white font-mono focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Кол-во занятий:</label>
                      <input
                        type="number"
                        min="1"
                        max="10"
                        value={newCountInput}
                        onChange={e => setNewCountInput(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-base sm:text-xs text-white font-mono font-bold text-center focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setNewIsExcused(false)}
                      className={`py-2 rounded-xl text-xs font-bold border transition ${
                        !newIsExcused
                          ? "bg-rose-500/20 border-rose-500 text-rose-300"
                          : "bg-slate-950 border-slate-800 text-slate-500"
                      }`}
                    >
                      🔴 Неуважительная
                    </button>
                    <button
                      type="button"
                      onClick={() => setNewIsExcused(true)}
                      className={`py-2 rounded-xl text-xs font-bold border transition ${
                        newIsExcused
                          ? "bg-sky-500/20 border-sky-500 text-sky-300"
                          : "bg-slate-950 border-slate-800 text-slate-500"
                      }`}
                    >
                      🔵 Уважительная
                    </button>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => handleClearCell(activeCell.student, activeCell.subject.id)}
                      className="px-3 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-rose-950/60 text-slate-400 hover:text-rose-300 transition"
                    >
                      Очистить всё
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20 transition"
                    >
                      Записать
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* МОДАЛЬНОЕ ОКНО МАССОВОГО ДОБАВЛЕНИЯ ПАРЫ («➕ ВНЕСТИ ПАРУ»)               */}
          {/* ========================================================================= */}
          {batchModalOpen && isAdmin && (
            <div 
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4"
              onClick={() => setBatchModalOpen(false)}
            >
              <div 
                className="bg-[#0f172a] border-t sm:border border-slate-700 w-full sm:max-w-xl rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl space-y-4 max-h-[92vh] flex flex-col"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div>
                    <div className="text-xs font-bold uppercase tracking-wider text-indigo-400">{currentMonth} • Быстрый ввод</div>
                    <h3 className="text-lg font-extrabold text-white">➕ Внести пропуски за пару</h3>
                  </div>
                  <button
                    onClick={() => setBatchModalOpen(false)}
                    className="w-8 h-8 rounded-xl bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleBatchSubmit} className="space-y-3.5 flex-1 flex flex-col overflow-hidden">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    <div className="sm:col-span-2">
                      <label className="block text-[11px] text-slate-400 mb-1">Дисциплина:</label>
                      <select
                        value={batchSubject}
                        onChange={e => setBatchSubject(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-base sm:text-xs text-white font-semibold focus:outline-none focus:border-indigo-500"
                      >
                        {SUBJECTS.map(s => (
                          <option key={s.id} value={s.id}>{s.short} — {s.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Число (или дата):</label>
                      <input
                        type="text"
                        placeholder={`напр. 12.${monthObj.num}`}
                        value={batchDate}
                        onChange={e => setBatchDate(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-base sm:text-xs text-white font-mono focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setBatchIsExcused(false)}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${
                        !batchIsExcused
                          ? "bg-rose-500/20 border-rose-500 text-rose-300"
                          : "bg-slate-900 border-slate-800 text-slate-400"
                      }`}
                    >
                      🔴 Неуважительная
                    </button>
                    <button
                      type="button"
                      onClick={() => setBatchIsExcused(true)}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold border transition ${
                        batchIsExcused
                          ? "bg-sky-500/20 border-sky-500 text-sky-300"
                          : "bg-slate-900 border-slate-800 text-slate-400"
                      }`}
                    >
                      🔵 Уважительная
                    </button>
                    <div className="flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5">
                      <span className="text-[11px] text-slate-400 mr-1.5">Зан.:</span>
                      <input
                        type="number"
                        min="1"
                        max="6"
                        value={batchCount}
                        onChange={e => setBatchCount(e.target.value)}
                        className="w-10 bg-transparent text-center font-mono font-bold text-sm text-white focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="flex items-center justify-between text-xs text-slate-400 pt-1">
                    <span>Отметьте отсутствующих ({batchSelectedStudents.length} выбр.):</span>
                    {batchSelectedStudents.length > 0 && (
                      <button
                        type="button"
                        onClick={() => setBatchSelectedStudents([])}
                        className="text-rose-400 hover:underline"
                      >
                        Сбросить выбор
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 overflow-y-auto pr-1 flex-1 py-1">
                    {STUDENTS.map((st, idx) => {
                      const isSel = batchSelectedStudents.includes(st);
                      return (
                        <button
                          type="button"
                          key={st}
                          onClick={() => toggleBatchStudent(st)}
                          className={`p-3 rounded-xl border text-left font-bold text-xs transition flex items-center justify-between active:scale-95 ${
                            isSel
                              ? batchIsExcused
                                ? "bg-sky-500/25 border-sky-400 text-white shadow"
                                : "bg-rose-500/25 border-rose-400 text-white shadow"
                              : "bg-slate-900/90 border-slate-800 text-slate-300 hover:border-slate-700"
                          }`}
                        >
                          <span className="truncate">{idx + 1}. {st}</span>
                          <span className={`w-4 h-4 rounded-md flex items-center justify-center text-[10px] ${
                            isSel ? "bg-white text-slate-950 font-extrabold" : "border border-slate-600"
                          }`}>
                            {isSel ? "✓" : ""}
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="pt-2 border-t border-slate-800 flex gap-2">
                    <button
                      type="button"
                      onClick={() => setBatchModalOpen(false)}
                      className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      disabled={batchSelectedStudents.length === 0}
                      className="flex-1 py-2.5 rounded-xl text-xs font-extrabold bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white shadow-lg shadow-indigo-600/25 transition"
                    >
                      Записать пропуск ({batchSelectedStudents.length} чел.)
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* МОДАЛЬНОЕ ОКНО ПРИВЯЗКИ УСТРОЙСТВА АДМИНИСТРАТОРА                         */}
          {/* ========================================================================= */}
          {authModalOpen && (
            <div 
              className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"
              onClick={() => setAuthModalOpen(false)}
            >
              <div 
                className="bg-[#0f172a] border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="font-extrabold text-white text-base">🔒 Вход в уголок администратора</h3>
                  <button
                    onClick={() => setAuthModalOpen(false)}
                    className="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <p className="text-xs text-slate-400 leading-relaxed">
                    Введите код доступа один раз — браузер запомнит это устройство, и повторный ввод пароля больше не потребуется.
                  </p>
                  <input
                    type="password"
                    placeholder="Код доступа..."
                    value={pinInput}
                    onChange={e => setPinInput(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-center font-mono text-base text-white tracking-widest focus:outline-none focus:border-indigo-500"
                    autoFocus
                  />
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl text-xs font-extrabold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/25 transition"
                  >
                    Привязать устройство и войти
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* МОДАЛЬНОЕ ОКНО СВОДКИ В ЧАТ                                               */}
          {/* ========================================================================= */}
          {summaryModalOpen && (
            <div 
              className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"
              onClick={() => setSummaryModalOpen(false)}
            >
              <div 
                className="bg-[#0f172a] border border-slate-700 w-full max-w-lg rounded-2xl p-5 shadow-2xl space-y-4"
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-extrabold text-white text-base">💬 Готовая сводка ({currentMonth})</h3>
                  <button
                    onClick={() => setSummaryModalOpen(false)}
                    className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <textarea
                  readOnly
                  rows={12}
                  value={generateSummaryText()}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none"
                />

                <div className="flex gap-2 justify-end">
                  <button
                    onClick={() => setSummaryModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700"
                  >
                    Закрыть
                  </button>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(generateSummaryText());
                      alert("Скопировано в буфер обмена!");
                    }}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20"
                  >
                    📋 Скопировать текст
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
