<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Табель платных отработок | Группа 2576-ЭБ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Кастомный скроллбар для таблицы на ПК */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const MONTHS = [
      { id: "Сентябрь", num: "09" },
      { id: "Октябрь", num: "10" },
      { id: "Ноябрь", num: "11" },
      { id: "Декабрь", num: "12" },
      { id: "Январь", num: "01" },
      { id: "Февраль", num: "02" },
      { id: "Март", num: "03" },
      { id: "Апрель", num: "04" },
      { id: "Май", num: "05" },
      { id: "Июнь", num: "06" },
      { id: "Июль", num: "07" },
      { id: "Август", num: "08" }
    ];

    const SUBJECTS = [
      { id: "opd", name: "Основы предпринимательской деятельности", short: "ОПД" },
      { id: "soc", name: "Социология", short: "Социология" },
      { id: "tv", name: "Теория вероятностей и мат. стат.", short: "Теор. вер." },
      { id: "ei", name: "Экономическая информатика", short: "Эк. инф." },
      { id: "pr", name: "Правовое регулирование", short: "Прав. рег." },
      { id: "fiz", name: "Физическая культура", short: "Физ-ра" },
      { id: "macro", name: "Макроэкономика", short: "Макроэк." },
      { id: "rit", name: "Риторика", short: "Риторика" },
      { id: "psy", name: "Психология и этика деловых отношений", short: "Психология" },
    ];

    const STUDENTS = [
      "Басалай", "Бондарев", "Варлахов", "Волков", 
      "Дмитриева", "Зенченко", "Ковалев", "Коваль", 
      "Лавринович", "Мартинович", "Молчанов", "Никитенко", 
      "Сивец", "Соболь", "Троцкая", "Чупринская"
    ];

    // Исходные данные за Октябрь
    const INITIAL_OCTOBER = {
      "Бондарев": { soc: [{ date: "16.10", count: 1, q: false }] },
      "Варлахов": { 
        fiz: [{ date: "13.10", count: 2, q: false }], 
        soc: [{ date: "16.10", count: 1, q: false }], 
        tv: [{ date: "28.10", count: 1, q: false }, { date: "29.10", count: 1, q: false }] 
      },
      "Волков": { opd: [{ date: "26.10", count: 1, q: false }, { date: "30.10", count: 1, q: false }] },
      "Дмитриева": { 
        opd: [{ date: "16.10", count: 1, q: false }], 
        soc: [{ date: "16.10", count: 1, q: false }] 
      },
      "Коваль": { 
        pr: [{ date: "12.10", count: 1, q: false }], 
        soc: [{ date: "16.10", count: 1, q: false }] 
      },
      "Лавринович": { 
        tv: [{ date: "01.10", count: 1, q: false }], 
        opd: [{ date: "26.10", count: 1, q: false }, { date: "30.10", count: 1, q: false }] 
      },
      "Молчанов": { opd: [{ date: "16.10", count: 1, q: false }] },
      "Никитенко": { 
        tv: [{ date: "01.10", count: 1, q: false }, { date: "28.10", count: 1, q: true }], 
        opd: [{ date: "02.10", count: 1, q: false }, { date: "26.10", count: 1, q: false }], 
        soc: [{ date: "02.10", count: 1, q: false }, { date: "16.10", count: 1, q: false }], 
        pr: [{ date: "12.10", count: 1, q: false }],
        ei: [{ date: "28.10", count: 1, q: true }]
      },
      "Сивец": { opd: [{ date: "26.10", count: 1, q: false }] },
      "Соболь": { soc: [{ date: "16.10", count: 1, q: false }] },
      "Троцкая": { 
        soc: [{ date: "16.10", count: 1, q: false }], 
        opd: [{ date: "30.10", count: 1, q: false }],
        tv: [{ date: "28.10", count: 1, q: true }],
        ei: [{ date: "28.10", count: 1, q: true }]
      },
      "Чупринская": { 
        ei: [{ date: "15.10", count: 1, q: false }], 
        tv: [{ date: "15.10", count: 1, q: false }] 
      }
    };

    const CLOUD_URL = "https://kvdb.io/AnonymousKey992348/group_2576_eb_dark_v2";

    function App() {
      const [currentMonth, setCurrentMonth] = useState("Октябрь");
      const [viewMode, setViewMode] = useState("sheet1"); // sheet1 | sheet3 | mobile
      const [searchQuery, setSearchQuery] = useState("");
      const [onlyDebtors, setOnlyDebtors] = useState(false);
      const [pricePerClass, setPricePerClass] = useState(() => {
        return localStorage.getItem("tabel_price_2576") || "";
      });

      const [allData, setAllData] = useState(() => {
        const saved = localStorage.getItem("tabel_dark_data_2576");
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return { "Октябрь": INITIAL_OCTOBER };
      });

      const [syncStatus, setSyncStatus] = useState("Загрузка...");
      const [lastSyncTime, setLastSyncTime] = useState("");
      const [isSaving, setIsSaving] = useState(false);
      const [showHeader, setShowHeader] = useState(true);
      const lastScrollY = useRef(0);

      // Модальное окно редактирования ячейки
      const [activeCell, setActiveCell] = useState(null); // { student, subject }
      const [newDateInput, setNewDateInput] = useState("");
      const [newCountInput, setNewCountInput] = useState(1);
      const [newIsQuestionable, setNewIsQuestionable] = useState(false);

      // Модальное окно сводки для чата
      const [summaryModalOpen, setSummaryModalOpen] = useState(false);

      // Умное скрытие верхней панели при скролле вниз на телефоне
      useEffect(() => {
        const handleScroll = () => {
          const currentY = window.scrollY;
          if (currentY <= 50) {
            setShowHeader(true);
          } else if (currentY > lastScrollY.current + 6) {
            setShowHeader(false);
          } else if (currentY < lastScrollY.current - 6) {
            setShowHeader(true);
          }
          lastScrollY.current = currentY;
        };
        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      // Загрузка из облака при старте
      useEffect(() => {
        loadFromCloud();
      }, []);

      useEffect(() => {
        localStorage.setItem("tabel_price_2576", pricePerClass);
      }, [pricePerClass]);

      const monthObj = useMemo(() => MONTHS.find(m => m.id === currentMonth) || MONTHS[1], [currentMonth]);
      const monthData = useMemo(() => allData[currentMonth] || {}, [allData, currentMonth]);

      const getTimeStr = () => {
        const now = new Date();
        return now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      };

      const loadFromCloud = async () => {
        setSyncStatus("Синхронизация...");
        try {
          const res = await fetch(CLOUD_URL);
          if (res.ok) {
            const data = await res.json();
            if (data && typeof data === "object" && Object.keys(data).length > 0) {
              setAllData(data);
              localStorage.setItem("tabel_dark_data_2576", JSON.stringify(data));
              setSyncStatus("Облако активно");
              setLastSyncTime(getTimeStr());
              return;
            }
          }
          setSyncStatus("Локальная база");
        } catch (err) {
          setSyncStatus("Локальный режим");
        }
      };

      const saveToCloud = async (updatedData) => {
        setIsSaving(true);
        setSyncStatus("Сохранение...");
        localStorage.setItem("tabel_dark_data_2576", JSON.stringify(updatedData));
        try {
          const res = await fetch(CLOUD_URL, {
            method: "POST",
            body: JSON.stringify(updatedData)
          });
          if (res.ok) {
            setSyncStatus("Сохранено в облако");
            setLastSyncTime(getTimeStr());
          } else {
            setSyncStatus("Сохранено на устройстве");
          }
        } catch (err) {
          setSyncStatus("Сохранено на устройстве");
        } finally {
          setIsSaving(false);
        }
      };

      // Получение записей по студенту и предмету
      const getEntries = (student, subjId) => {
        return monthData[student]?.[subjId] || [];
      };

      // Статистика по студенту
      const getStudentSummary = (student) => {
        let exact = 0;
        let questionable = 0;
        const allDatesBySubj = [];

        SUBJECTS.forEach(s => {
          const entries = getEntries(student, s.id);
          if (entries.length > 0) {
            const dList = [];
            entries.forEach(e => {
              if (e.q) questionable += e.count;
              else exact += e.count;
              dList.push(`${e.date}${e.count > 1 ? ` (x${e.count})` : ""}${e.q ? "?" : ""}`);
            });
            allDatesBySubj.push({ short: s.short, text: dList.join(", ") });
          }
        });

        return { exact, questionable, allDatesBySubj };
      };

      // Общая статистика за месяц
      const monthTotals = useMemo(() => {
        let totalExact = 0;
        let totalQ = 0;
        let debtorsCount = 0;
        const bySubject = {};
        SUBJECTS.forEach(s => { bySubject[s.id] = { exact: 0, q: 0 }; });

        STUDENTS.forEach(st => {
          const { exact, questionable } = getStudentSummary(st);
          totalExact += exact;
          totalQ += questionable;
          if (exact > 0 || questionable > 0) debtorsCount++;

          SUBJECTS.forEach(s => {
            const entries = getEntries(st, s.id);
            entries.forEach(e => {
              if (e.q) bySubject[s.id].q += e.count;
              else bySubject[s.id].exact += e.count;
            });
          });
        });

        return { totalExact, totalQ, debtorsCount, bySubject };
      }, [monthData]);

      // Добавление новой записи пропуска
      const handleAddAbsence = (e) => {
        e.preventDefault();
        if (!activeCell) return;
        const { student, subject } = activeCell;

        let formattedDate = newDateInput.trim();
        if (!formattedDate) formattedDate = `01.${monthObj.num}`;
        else if (/^\d{1,2}$/.test(formattedDate)) {
          formattedDate = `${formattedDate.padStart(2, "0")}.${monthObj.num}`;
        }

        const currentList = [...getEntries(student, subject.id)];
        currentList.push({
          date: formattedDate,
          count: Math.max(1, parseInt(newCountInput, 10) || 1),
          q: newIsQuestionable
        });

        const updated = {
          ...allData,
          [currentMonth]: {
            ...(allData[currentMonth] || {}),
            [student]: {
              ...(allData[currentMonth]?.[student] || {}),
              [subject.id]: currentList
            }
          }
        };

        setAllData(updated);
        saveToCloud(updated);
        setNewDateInput("");
        setNewCountInput(1);
        setNewIsQuestionable(false);
      };

      const handleRemoveEntry = (student, subjId, idx) => {
        const currentList = [...getEntries(student, subjId)];
        currentList.splice(idx, 1);

        const updated = {
          ...allData,
          [currentMonth]: {
            ...(allData[currentMonth] || {}),
            [student]: {
              ...(allData[currentMonth]?.[student] || {}),
              [subjId]: currentList
            }
          }
        };
        setAllData(updated);
        saveToCloud(updated);
      };

      const handleToggleEntryQuestionable = (student, subjId, idx) => {
        const currentList = [...getEntries(student, subjId)];
        currentList[idx] = { ...currentList[idx], q: !currentList[idx].q };

        const updated = {
          ...allData,
          [currentMonth]: {
            ...(allData[currentMonth] || {}),
            [student]: {
              ...(allData[currentMonth]?.[student] || {}),
              [subjId]: currentList
            }
          }
        };
        setAllData(updated);
        saveToCloud(updated);
      };

      const handleClearCell = (student, subjId) => {
        const updated = {
          ...allData,
          [currentMonth]: {
            ...(allData[currentMonth] || {}),
            [student]: {
              ...(allData[currentMonth]?.[student] || {}),
              [subjId]: []
            }
          }
        };
        setAllData(updated);
        saveToCloud(updated);
        setActiveCell(null);
      };

      // Отфильтрованный список студентов
      const filteredStudents = useMemo(() => {
        return STUDENTS.filter(st => {
          const matchesSearch = st.toLowerCase().includes(searchQuery.toLowerCase());
          if (!matchesSearch) return false;
          if (onlyDebtors) {
            const { exact, questionable } = getStudentSummary(st);
            return exact > 0 || questionable > 0;
          }
          return true;
        });
      }, [searchQuery, onlyDebtors, monthData]);

      // Выгрузка в CSV для Excel
      const exportToExcelCSV = () => {
        let csv = "\uFEFF№;Фамилия;" + SUBJECTS.map(s => s.short).join(";") + ";Точных отработок;Под вопросом (?);Сумма (BYN)\n";
        STUDENTS.forEach((st, i) => {
          const { exact, questionable } = getStudentSummary(st);
          const rowCells = SUBJECTS.map(s => {
            const entries = getEntries(st, s.id);
            if (entries.length === 0) return "";
            const totalC = entries.reduce((acc, e) => acc + e.count, 0);
            const datesStr = entries.map(e => `${e.date}${e.q ? "?" : ""}`).join(", ");
            return `${totalC} (${datesStr})`;
          });
          const cost = pricePerClass ? (exact * parseFloat(pricePerClass)).toFixed(2) : "-";
          csv += `${i + 1};${st};${rowCells.join(";")};${exact};${questionable};${cost}\n`;
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Табель_2576-ЭБ_${currentMonth}.csv`;
        link.click();
      };

      // Экспорт / Импорт JSON-бэкапа
      const exportJSONBackup = () => {
        const blob = new Blob([JSON.stringify(allData, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Backup_2576-EB_${new Date().toISOString().slice(0,10)}.json`;
        link.click();
      };

      const importJSONBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed && typeof parsed === "object") {
              setAllData(parsed);
              saveToCloud(parsed);
              alert("База успешно загружена и синхронизирована!");
            }
          } catch (err) {
            alert("Ошибка чтения файла резервной копии.");
          }
        };
        reader.readAsText(file);
      };

      // Текст сводки для Telegram / Viber
      const generateSummaryText = () => {
        let text = `📌 ВЕДОМОСТЬ ПЛАТНЫХ ОТРАБОТОК — ${currentMonth.toUpperCase()}\n`;
        text += `🎓 Группа 2576-ЭБ (МИТСО)\n`;
        text += `──────────────────────\n\n`;
        let count = 0;

        STUDENTS.forEach(st => {
          const { exact, questionable } = getStudentSummary(st);
          if (exact === 0 && questionable === 0) return;
          count++;
          const costStr = (pricePerClass && exact > 0) 
            ? ` | 💰 ${(exact * parseFloat(pricePerClass)).toFixed(2)} BYN` 
            : "";

          text += `👤 ${st} — всего: ${exact} зан.${questionable > 0 ? ` (+${questionable} под ?)` : ""}${costStr}\n`;
          SUBJECTS.forEach(s => {
            const entries = getEntries(st, s.id);
            if (entries.length > 0) {
              const c = entries.reduce((a, b) => a + b.count, 0);
              const d = entries.map(e => `${e.date}${e.count > 1 ? `x${e.count}` : ""}${e.q ? "?" : ""}`).join(", ");
              text += `   • ${s.short}: ${c} (${d})\n`;
            }
          });
          text += `\n`;
        });

        if (count === 0) {
          text += `✅ В этом месяце платных отработок нет!\n`;
        } else {
          text += `──────────────────────\n`;
          text += `📊 Итого по группе: ${monthTotals.totalExact} зан. у ${monthTotals.debtorsCount} чел.`;
          if (monthTotals.totalQ > 0) text += ` (еще ${monthTotals.totalQ} уточняются)`;
        }
        return text;
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#0b1120] text-slate-100 pb-20">
          
          {/* УМНАЯ ТЕМНО-СИНЯЯ ШАПКА (Прячется при скролле вниз, появляется при скролле вверх) */}
          <header className={`sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-xl border-b border-slate-800/80 shadow-2xl transition-transform duration-300 ${
            showHeader ? "translate-y-0" : "-translate-y-full"
          }`}>
            <div className="max-w-[1440px] mx-auto px-3 sm:px-6 py-3">
              
              {/* Верхний ряд: Название + Кнопки управления */}
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-extrabold text-white text-sm tracking-wider">
                    2576
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-base sm:text-lg font-extrabold tracking-tight text-white">
                        Табель платных отработок
                      </h1>
                      <span className="hidden sm:inline-block px-2 py-0.5 text-[11px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 rounded-full">
                        2576-ЭБ
                      </span>
                    </div>
                    <div className="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
                      <span className={`w-2 h-2 rounded-full ${isSaving ? "bg-amber-400 animate-ping" : "bg-emerald-400"}`}></span>
                      <span>{syncStatus}{lastSyncTime ? ` (${lastSyncTime})` : ""}</span>
                    </div>
                  </div>
                </div>

                {/* Панель действий */}
                <div className="flex items-center flex-wrap gap-1.5 sm:gap-2">
                  <button
                    onClick={() => saveToCloud(allData)}
                    disabled={isSaving}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/20 transition active:scale-95 flex items-center gap-1.5"
                  >
                    <span>💾</span>
                    <span>{isSaving ? "Сохранение..." : "Сохранить"}</span>
                  </button>

                  <button
                    onClick={loadFromCloud}
                    title="Обновить из облака"
                    className="p-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition active:scale-95"
                  >
                    🔄
                  </button>

                  <button
                    onClick={() => setSummaryModalOpen(true)}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600/90 hover:bg-emerald-500 text-white shadow-md shadow-emerald-600/20 transition flex items-center gap-1.5"
                  >
                    <span>💬</span>
                    <span className="hidden md:inline">Сводка в чат</span>
                  </button>

                  <button
                    onClick={exportToExcelCSV}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1"
                    title="Скачать таблицу для Excel"
                  >
                    <span>📊</span>
                    <span className="hidden lg:inline">Excel</span>
                  </button>

                  <button
                    onClick={exportJSONBackup}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition hidden sm:flex items-center gap-1"
                    title="Скачать резервную копию базы"
                  >
                    <span>⬇️</span>
                    <span className="hidden xl:inline">Бэкап</span>
                  </button>

                  <label className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition cursor-pointer hidden sm:flex items-center gap-1" title="Загрузить базу из файла">
                    <span>⬆️</span>
                    <input type="file" accept=".json" onChange={importJSONBackup} className="hidden" />
                  </label>
                </div>
              </div>

              {/* Второй ряд: Лента 12 месяцев */}
              <div className="flex items-center gap-1.5 mt-3 overflow-x-auto no-scrollbar pb-1">
                {MONTHS.map(m => {
                  const isActive = currentMonth === m.id;
                  const hasData = allData[m.id] && Object.keys(allData[m.id]).length > 0;
                  return (
                    <button
                      key={m.id}
                      onClick={() => setCurrentMonth(m.id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                        isActive
                          ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 ring-1 ring-indigo-400"
                          : "bg-slate-800/70 text-slate-400 hover:bg-slate-800 hover:text-slate-200"
                      }`}
                    >
                      <span>{m.id}</span>

                        value={newCountInput}
                        onChange={e => setNewCountInput(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white font-mono font-bold text-center focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  <label className="flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none pt-1">
                    <input
                      type="checkbox"
                      checked={newIsQuestionable}
                      onChange={e => setNewIsQuestionable(e.target.checked)}
                      className="rounded border-slate-700 bg-slate-950 text-amber-500 focus:ring-0"
                    />
                    <span>Пометить как спорный «Под вопросом (?)»</span>
                  </label>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => handleClearCell(activeCell.student, activeCell.subject.id)}
                      className="px-3 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-rose-950/60 text-slate-400 hover:text-rose-300 transition"
                    >
                      Очистить всё
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-lg text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20 transition"
                    >
                      Добавить запись
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* МОДАЛЬНОЕ ОКНО ГЕНЕРАЦИИ СВОДКИ В ЧАТ */}
          {summaryModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0f172a] border border-slate-700 w-full max-w-lg rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-extrabold text-white text-base">💬 Готовая сводка для группы ({currentMonth})</h3>
                  <button
                    onClick={() => setSummaryModalOpen(false)}
                    className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <textarea
                  readOnly
                  rows={12}
                  value={generateSummaryText()}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-200 focus:outline-none"
                />

                <div className="flex gap-2 justify-end">
                  <button
                    onClick={() => setSummaryModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700"
                  >
                    Закрыть
                  </button>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(generateSummaryText());
                      alert("Скопировано в буфер обмена!");
                    }}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20"
                  >
                    📋 Скопировать текст
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
